<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cacaoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1f14"/>
      <stop offset="50%" stop-color="#271812"/>
      <stop offset="100%" stop-color="#140a06"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed269"/>
      <stop offset="50%" stop-color="#ecc15a"/>
      <stop offset="100%" stop-color="#b67357"/>
    </linearGradient>
  </defs>
  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="16" fill="url(#cacaoGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Stylized Cacao Pod & Chocolate Crystal -->
  <g transform="translate(12, 10)">
    <!-- Cacao Pod silhouette -->
    <path d="M20 3 C30 10, 36 22, 34 32 C32 40, 24 45, 20 45 C16 45, 8 40, 6 32 C4 22, 10 10, 20 3 Z" fill="#4a281c" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Central crystallographic meridian -->
    <path d="M20 3 C22 16, 22 30, 20 45" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M20 3 C27 15, 28 28, 20 45" fill="none" stroke="#fed269" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.7"/>
    <path d="M20 3 C13 15, 12 28, 20 45" fill="none" stroke="#fed269" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.7"/>
    <!-- Cacao stem node -->
    <circle cx="20" cy="3" r="2.5" fill="#fed269"/>
    <!-- Diamond luster star -->
    <path d="M30 12 L31.5 15 L34.5 16.5 L31.5 18 L30 21 L28.5 18 L25.5 16.5 L28.5 15 Z" fill="#fed269"/>
  </g>
</svg>
